<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host — LOVE Creative Café</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="assets/logo/logo-love.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/love.css?v=627bb210">
<style>
/* ═══ Host-Bereich: modernes Kapitel-Layout, handyoptimiert ═══ */
.host-wrap{max-width:1180px;margin:0 auto;padding:1.6rem clamp(.9rem,3vw,2.2rem) 4rem}
.host-login{max-width:400px;margin:8vh auto 0}

/* Kapitel-Navigation: Sidebar (Desktop) / scrollbare Leiste (Handy) */
.host-shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:1.5rem;align-items:start}
.host-nav{position:sticky;top:92px;display:flex;flex-direction:column;gap:.2rem;background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-m);padding:.55rem}
.host-nav button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:.58rem .75rem;font-family:var(--ff-body);font-weight:600;font-size:.92rem;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s ease}
.host-nav button:hover{background:var(--celadon)}
.host-nav button[aria-pressed="true"]{background:var(--green);color:#fff}
.host-nav .ic{font-size:1rem;line-height:1}
.hbadge{margin-left:auto;background:var(--rose);color:#fff;border-radius:999px;font-size:.68rem;font-weight:700;padding:.12rem .45rem;min-width:1.35rem;text-align:center;line-height:1.2}
.host-nav button[aria-pressed="true"] .hbadge{background:#fff;color:var(--rose)}
@media (max-width:900px){
  .host-shell{display:block}
  .host-nav{position:sticky;top:74px;z-index:60;flex-direction:row;overflow-x:auto;padding:.4rem;margin:0 calc(-1 * clamp(.9rem,3vw,2.2rem)) 1rem;border-radius:0;border-left:0;border-right:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .host-nav::-webkit-scrollbar{display:none}
  .host-nav button{flex:0 0 auto;width:auto;padding:.5rem .7rem;font-size:.86rem}
  .host-nav .hbadge{margin-left:.15rem}
}

/* Karten & Tabellen */
.host-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin:1rem 0 1.4rem}
.host-stat{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-m);padding:.85rem 1rem;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;text-align:left;font-family:var(--ff-body)}
.host-stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(51,115,87,.10)}
.host-stat b{font-family:var(--ff-display);font-size:1.5rem;color:var(--rose);display:block}
.host-stat span{font-size:.78rem;color:var(--ink-soft)}
.host-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;font-size:.9rem}
.host-table-wrap{overflow-x:auto;border-radius:var(--r-m)}
.host-table th{background:var(--celadon);color:var(--green);text-align:left;font-weight:600;padding:.6rem .8rem;white-space:nowrap}
.host-table td{padding:.55rem .8rem;border-top:1px dashed var(--line-soft);vertical-align:top}
.host-table tr:hover td{background:var(--warmwhite)}
.host-pill{display:inline-block;background:var(--mimi);color:var(--green);border-radius:999px;font-size:.75rem;font-weight:600;padding:.15rem .6rem;white-space:nowrap}
.host-pill.neu{background:var(--rose);color:#fff}
.host-pill.ok{background:var(--green);color:#fff}
.host-empty{color:var(--ink-soft);font-size:.92rem;padding:1.2rem;background:#fff;border:1px dashed var(--line);border-radius:var(--r-m)}
.host-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.6rem}
.host-sect{font-size:1.08rem;margin:1.5rem 0 .7rem}
.host-sect:first-child{margin-top:0}

/* Anfrage-/Termin-Karten */
.hcards{display:flex;flex-direction:column;gap:.65rem}
.hcard{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-m);padding:.95rem 1.05rem;box-shadow:0 1px 4px rgba(51,115,87,.05)}
.hcard.pending{border-left:4px solid var(--rose)}
.hcard-top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:baseline}
.hcard-top b{font-size:1rem}
.hcard-meta{color:var(--ink-soft);font-size:.86rem;margin-top:.15rem;overflow-wrap:anywhere}
.hcard-msg{background:var(--warmwhite);border-radius:10px;padding:.45rem .6rem;font-size:.85rem;margin-top:.5rem}
.hcard-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.hday{font-weight:700;color:var(--green);margin:1.1rem 0 .5rem;font-size:.95rem}
.hday:first-child{margin-top:0}

/* Monats-Kalender */
.hcal-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.6rem}
.hcal-head b{font-family:var(--ff-display);font-size:1.15rem;color:var(--green)}
.hcal-nav{border:1.5px solid var(--line);background:#fff;border-radius:999px;width:2.1rem;height:2.1rem;font-size:1rem;cursor:pointer;color:var(--green)}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hcal-wd{font-size:.7rem;font-weight:700;color:var(--ink-soft);text-align:center;padding:.15rem 0;text-transform:uppercase;letter-spacing:.06em}
.hcal-day{position:relative;min-height:62px;background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:.28rem .4rem;font-size:.78rem;cursor:pointer;text-align:left;font-family:var(--ff-body)}
.hcal-day:disabled{cursor:default}
.hcal-day.empty{background:none;border:0}
.hcal-day.today{border:2px solid var(--rose)}
.hcal-day.closed{background:var(--warmwhite);color:var(--ink-soft)}
.hcal-day.sel{outline:3px solid var(--green);outline-offset:-1px}
.hcal-n{position:absolute;top:.22rem;right:.38rem;font-weight:600}
.hcal-count{display:inline-block;background:var(--green);color:#fff;border-radius:999px;font-size:.66rem;font-weight:700;padding:.06rem .38rem;margin-top:1.15rem}
.hcal-pend{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:3px;vertical-align:middle}
@media (max-width:640px){.hcal-day{min-height:50px}.hcal-count{margin-top:.95rem}}

/* Onboarding auf der Startseite */
.onb{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r-m);padding:1.1rem 1.2rem;margin-top:1.4rem}
.onb h3{margin-bottom:.5rem;font-size:1.05rem}
.onb ol{margin:.4rem 0 0 1.1rem;padding:0;font-size:.92rem;display:grid;gap:.45rem}
.onb b{color:var(--green)}
.host-note{background:var(--celadon);border-radius:12px;padding:.6rem .8rem;font-size:.85rem;color:var(--green);margin:.8rem 0}
</style>
</head>
<body>
<header class="site">
  <div class="nav-in">
    <a class="brand" href="index.html" aria-label="LOVE Creative Café — Start">
      <img src="assets/logo/logo-love.svg" alt="" width="46" height="46">
      <span class="brand-name">LOVE<small>Host-Bereich</small></span>
    </a>
    <div style="margin-left:auto;display:flex;gap:.6rem;align-items:center">
      <a class="btn btn-ghost btn-sm" href="index.html">Zur Website</a>
      <button class="btn btn-rose btn-sm hidden" id="hostLogout" type="button">Abmelden</button>
    </div>
  </div>
</header>

<main class="host-wrap">

<!-- ═══════ Login ═══════ -->
<div id="hostGate">
  <div class="panel host-login">
    <div class="panel-head"><h3>Host-Zugang</h3></div>
    <div class="panel-body">
      <form id="hostForm" novalidate>
        <div class="field"><label for="hostUser">Benutzername</label><input type="text" id="hostUser" autocomplete="username"></div>
        <div class="field"><label for="hostPass">Passwort</label><input type="password" id="hostPass" autocomplete="current-password"></div>
        <button type="submit" class="btn btn-rose btn-block">Anmelden</button>
        <p class="form-err" id="hostErr" aria-live="polite"></p>
      </form>
      <p class="hint" style="margin-top:1rem">Interner Bereich für das Gastgeber-Team: Anfragen, Termine, Kunden und Shop. Kein öffentlicher Zugang.</p>
    </div>
  </div>
</div>

<!-- ═══════ App ═══════ -->
<div id="hostApp" class="hidden">
  <div class="host-shell">
    <nav class="host-nav" id="hostNav" aria-label="Kapitel"></nav>
    <section id="hostMain">
      <p class="hint" id="cloudState" style="margin-bottom:.6rem"></p>
      <div id="hostContent"></div>
      <div class="host-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="expKunden">Kunden als CSV</button>
        <button type="button" class="btn btn-ghost btn-sm" id="expBackup">Komplett-Backup (JSON)</button>
      </div>
    </section>
  </div>
</div>

</main>

<script src="assets/js/love-data.js?v=01eaf989"></script>
<script src="assets/js/love-cloud.js?v=2c94f003"></script>
<script src="assets/js/love-account.js?v=43f3acf9"></script>
<script>
(() => {
'use strict';
/* Zugangsschutz: SHA-256 von "benutzer:passwort:LOVE-2026" — Klartext steht nicht im Code.
   Gültige Logins: Benutzer «host» mit dem neuen kurzen oder dem alten langen Passwort. */
const HOST_HASHES = [
  '0e8df6f4667d3b4669a7e9ae47e9f66c747e3558949fb56229a4111ca7b14982',
  '843aa433e5fcabcbee596da796e19f629a8514f5373663be673437b83754f74b'
];
const SESSION_KEY = 'love.host.session.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const hasSession = () => {
  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY)); return s && s.exp > Date.now(); }
  catch (e) { return false; }
};

function show(loggedIn) {
  $('#hostGate').classList.toggle('hidden', loggedIn);
  $('#hostApp').classList.toggle('hidden', !loggedIn);
  $('#hostLogout').classList.toggle('hidden', !loggedIn);
  if (loggedIn) render();
}
let hostCreds = null;  // nur im Arbeitsspeicher, für die Cloud-Abfrage
let cloudData = null;  // zentrale Live-Daten vom Server (wenn erreichbar)

$('#hostForm').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('#hostUser').value.trim().toLowerCase();
  const pass = $('#hostPass').value;
  const hash = await sha256hex(user + ':' + pass + ':LOVE-2026');
  if (!HOST_HASHES.includes(hash)) { $('#hostErr').textContent = 'Benutzername oder Passwort falsch.'; return; }
  hostCreds = { user, pass };
  localStorage.setItem(SESSION_KEY, JSON.stringify({ exp: Date.now() + 12 * 3600 * 1000 }));
  $('#hostPass').value = '';
  show(true);
  loadCloud();
});

/* Zentrale Daten aus der Infomaniak-Cloud laden (Fallback: lokaler Speicher) */
async function loadCloud() {
  const note = $('#cloudState');
  if (typeof LoveCloud === 'undefined' || !hostCreds) { note.textContent = '○ Lokale Daten (dieses Gerät)'; return; }
  if (!LoveCloud.isOnline()) await LoveCloud.check();
  if (!LoveCloud.isOnline()) { note.textContent = '○ Cloud nicht erreichbar — lokale Daten (dieses Gerät)'; return; }
  try {
    const r = await LoveCloud.call('host_data', hostCreds);
    if (r.ok) { cloudData = r; note.textContent = '● Cloud verbunden — zentrale Live-Daten'; render(); }
    else note.textContent = '○ Cloud-Anmeldung fehlgeschlagen — lokale Daten';
  } catch (e) { note.textContent = '○ Cloud-Fehler — lokale Daten'; }
}
$('#hostLogout').addEventListener('click', () => { localStorage.removeItem(SESSION_KEY); show(false); });

/* Schliesstage aus dem Google-Kalender (für den Host-Kalender) */
let closures = [];
function loadClosures() {
  if (typeof LoveCloud === 'undefined') return;
  LoveCloud.call('closures').then(r => {
    if (r.ok && Array.isArray(r.closures)) { closures = r.closures; if (chapter === 'kalender') render(); }
  }).catch(() => {});
}

/* ---------- Daten-Helfer ---------- */
const fmtTs = iso => iso ? new Date(iso).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—';
const fmtDay = iso => iso ? String(iso).split('-').reverse().join('.') : '—';
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const TYPE_LBL = { tisch: 'Tisch', reservation: 'Tisch', kino: 'Kino-Night', workshop: 'Workshop', kidscamp: 'Kidscamp', geburtstag: 'Geburtstag', event: 'Event', warteliste: 'Warteliste', membership: 'Membership', geschenk: 'Geschenk', intern: 'Termin' };
const typeLbl = t => TYPE_LBL[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1) : '—');
const STATUS_CLS = s => s === 'neu' ? 'neu' : (s === 'bestätigt' || s === 'gewonnen') ? 'ok' : '';
const STATUS_LBL = { neu: 'Anfrage', 'bestätigt': 'bestätigt', gewonnen: 'bestätigt', abgelehnt: 'abgelehnt', storniert: 'storniert', verloren: 'storniert' };

function getData() {
  const kunden = cloudData
    ? cloudData.customers.map(k => ({ name: k.name, email: k.email, username: k.username, phone: k.phone, points: k.points, created: k.created_at, lastLogin: k.last_login }))
    : LoveAccount.listCustomers();
  const kontakte = cloudData
    ? cloudData.contacts.map(c => ({ email: c.email, name: c.name, phone: c.phone, tags: String(c.tags || '').split(',').filter(Boolean), lastSeen: c.last_seen }))
    : LoveData.listContacts();
  return {
    kunden, kontakte,
    buchungen: cloudData ? cloudData.bookings : LoveData.listBookings(),
    gutscheine: cloudData ? cloudData.vouchers : LoveData.listVouchers(),
    members: cloudData ? cloudData.members : (LoveData.listMembers ? LoveData.listMembers() : []),
    redemptions: cloudData ? (cloudData.redemptions || []) : [],
    pwResets: cloudData ? (cloudData.pw_resets || []) : [],
    dienste: cloudData ? (cloudData.services || []) : [],
    bestellungen: cloudData ? (cloudData.orders || []) : (LoveData.listOrders ? LoveData.listOrders() : [])
  };
}
/* Neue Reservations-Anfragen: online gebucht, warten auf Annahme */
const pendingBookings = d => d.buchungen.filter(b => b.status === 'neu' && b.date && !['warteliste', 'geschenk'].includes(b.type));
const upcoming = d => d.buchungen
  .filter(b => ['bestätigt', 'gewonnen'].includes(b.status) && b.date >= todayISO())
  .sort((a, b2) => (a.date + (a.time || '')).localeCompare(b2.date + (b2.time || '')));
const openRequests = d => pendingBookings(d).length
  + d.pwResets.filter(r => r.status === 'offen').length
  + d.redemptions.filter(r => r.status === 'offen').length;

/* ---------- Kapitel-Navigation ---------- */
let chapter = 'start';
const CHAPTERS = [
  { id: 'start', ic: '🏠', lbl: 'Start' },
  { id: 'anfragen', ic: '📥', lbl: 'Anfragen', badge: d => openRequests(d) },
  { id: 'termine', ic: '📅', lbl: 'Interner Kalender', badge: d => upcoming(d).filter(b => b.date === todayISO()).length },
  { id: 'kalender', ic: '🗓️', lbl: 'Kundenkalender' },
  { id: 'buchungen', ic: '📖', lbl: 'Buchungen' },
  { id: 'kunden', ic: '👥', lbl: 'Kunden' },
  { id: 'bestellungen', ic: '🛍️', lbl: 'Shop', badge: d => d.bestellungen.filter(o => o.status === 'neu').length },
  { id: 'gutscheine', ic: '🎁', lbl: 'Gutscheine' },
  { id: 'dienste', ic: '🎨', lbl: 'Angebote' },
  { id: 'eroeffnung', ic: '🎉', lbl: 'Eröffnung' }
];
function renderNav(d) {
  $('#hostNav').innerHTML = CHAPTERS.map(c => {
    const n = c.badge ? c.badge(d) : 0;
    return `<button type="button" data-ch="${c.id}" aria-pressed="${chapter === c.id}">
      <span class="ic" aria-hidden="true">${c.ic}</span><span>${c.lbl}</span>${n ? `<span class="hbadge">${n}</span>` : ''}
    </button>`;
  }).join('');
  $('#hostNav').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    chapter = b.dataset.ch;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));
}

/* Host-Aktion an die Cloud schicken (mit Zugangsdaten), danach neu laden */
async function hostCall(action, data) {
  if (typeof LoveCloud === 'undefined' || !hostCreds) { alert('Cloud nicht verbunden.'); return; }
  try {
    const r = await LoveCloud.call(action, Object.assign({}, hostCreds, data || {}));
    if (!r.ok) alert('Fehler: ' + (r.error || 'unbekannt'));
  } catch (e) { alert('Cloud-Fehler — bitte erneut versuchen.'); }
  /* Nach Buchungs-Aktionen den Kundenkalender sofort frisch von Google holen */
  if (/^(booking_|host_event_)/.test(action)) { try { loadGcalMonth(calKey(), true); } catch (e) { } }
  loadCloud();
}
function wireHostActions(box) {
  box.querySelectorAll('button[data-act]').forEach(btn => btn.addEventListener('click', () => {
    btn.disabled = true;
    hostCall(btn.dataset.act, { id: btn.dataset.id });
  }));
}

/* Karte einer Buchung (Anfragen & Termine) */
function bookingCard(b, withActions) {
  const msg = String(b.message || '').replace(/\s*\[Widget\]$/, '').trim();
  return `<div class="hcard ${b.status === 'neu' ? 'pending' : ''}">
    <div class="hcard-top">
      <b>${esc(typeLbl(b.type))} · ${esc(b.name || '—')}</b>
      <span class="host-pill ${STATUS_CLS(b.status)}">${esc(STATUS_LBL[b.status] || b.status)}</span>
    </div>
    <p class="hcard-meta">${fmtDay(b.date)}${b.time ? ' · ' + esc(b.time) : ''}${b.persons ? ' · ' + esc(b.persons) + ' P.' : ''}${b.world ? ' · ' + esc(b.world) : ''} · ${esc(b.email || '—')}${b.phone ? ' · ' + esc(b.phone) : ''} · <span style="font-size:.78em">${esc(b.id)}</span></p>
    ${msg ? `<p class="hcard-msg">💬 ${esc(msg)}</p>` : ''}
    ${withActions ? `<div class="hcard-actions">
      <button class="btn btn-green btn-sm" data-bact="booking_confirm" data-id="${esc(b.id)}">✓ Annehmen</button>
      <button class="btn btn-ghost btn-sm" data-bact="booking_reject" data-id="${esc(b.id)}">Ablehnen</button>
    </div>` : ''}
  </div>`;
}
function wireBookingActions(box) {
  box.querySelectorAll('button[data-bact]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.bact === 'booking_reject' && !confirm('Diese Anfrage wirklich ablehnen? Der Gast bekommt eine Absage-Mail.')) return;
    btn.disabled = true;
    hostCall(btn.dataset.bact, { id: btn.dataset.id });
  }));
}

/* ---------- Kapitel-Ansichten ---------- */
function render() {
  const d = getData();
  renderNav(d);
  const box = $('#hostContent');

  /* ═══ Start: Übersicht + Onboarding ═══ */
  if (chapter === 'start') {
    const heute = upcoming(d).filter(b => b.date === todayISO());
    const offen = openRequests(d);
    box.innerHTML = `
      <p class="eyebrow">Host</p>
      <h1 style="font-size:clamp(1.6rem,1.2rem+1.6vw,2.2rem)">Schön, dass du da bist ♥</h1>
      <div class="host-stats">
        <button type="button" class="host-stat" data-go="anfragen"><b>${offen}</b><span>Offene Anfragen</span></button>
        <button type="button" class="host-stat" data-go="termine"><b>${heute.length}</b><span>Termine heute</span></button>
        <button type="button" class="host-stat" data-go="buchungen"><b>${d.buchungen.length}</b><span>Buchungen gesamt</span></button>
        <button type="button" class="host-stat" data-go="kunden"><b>${d.kunden.length}</b><span>Kundenkonten</span></button>
        <button type="button" class="host-stat" data-go="bestellungen"><b>${d.bestellungen.filter(o => o.status === 'neu').length}</b><span>Neue Bestellungen</span></button>
        <button type="button" class="host-stat" data-go="gutscheine"><b>${d.gutscheine.length}</b><span>Gutscheine</span></button>
      </div>
      ${offen ? `<div class="hcard pending"><div class="hcard-top"><b>📥 ${offen} offene Anfrage${offen === 1 ? '' : 'n'}</b>
        <button type="button" class="btn btn-rose btn-sm" data-go="anfragen">Jetzt ansehen</button></div>
        <p class="hcard-meta">Neue Reservationen annehmen, Passwort-Resets freigeben, Punkte-Einlösungen genehmigen.</p></div>` : ''}
      <h3 class="host-sect">Heute im Café</h3>
      ${heute.length ? `<div class="hcards">${heute.map(b => bookingCard(b, false)).join('')}</div>`
        : `<p class="host-empty">Heute stehen keine bestätigten Termine an.</p>`}
      <div class="onb">
        <h3>🌱 So funktioniert dein Host-Bereich</h3>
        <ol>
          <li><b>📥 Anfragen</b> — Jede Online-Reservation kommt zuerst hier an. Mit <b>Annehmen</b> geht automatisch die Bestätigungs-Mail an den Gast raus und der Termin wandert in den Google-Kalender (und damit in die SumUp-Kasse). <b>Ablehnen</b> schickt eine freundliche Absage und gibt den Tisch sofort wieder frei.</li>
          <li><b>📅 Interner Kalender</b> — Alle angenommenen Buchungen der nächsten Tage, nach Tag gruppiert.</li>

/* ---------- Kundenkalender: live aus dem Google-Kalender ---------- */
let calMonth = null;   // Date auf den 1. des angezeigten Monats
let calSel = null;     // ausgewählter Tag (ISO)
const CLOSED_RX = /geschlossen|closed|ferien|feiertag|holiday|betriebsferien/i;
const gcalCache = {};  // 'YYYY-MM' → { ts, events } — Echtzeit-Daten vom Google-Kalender
function calKey() {
  if (!calMonth) { const t = new Date(); calMonth = new Date(t.getFullYear(), t.getMonth(), 1, 12); }
  return `${calMonth.getFullYear()}-${String(calMonth.getMonth() + 1).padStart(2, '0')}`;
}
function loadGcalMonth(key, force) {
  if (typeof LoveCloud === 'undefined' || !hostCreds || !LoveCloud.isOnline()) return;
  const c = gcalCache[key];
  if (!force && c && Date.now() - c.ts < 45000) return;
  gcalCache[key] = { ts: Date.now(), events: c ? c.events : null };
  LoveCloud.call('gcal_events', Object.assign({}, hostCreds, { month: key })).then(r => {
    if (r.ok && r.enabled !== false && Array.isArray(r.events)) {
      gcalCache[key] = { ts: Date.now(), events: r.events };
      if (chapter === 'kalender') render();
    }
  }).catch(() => {});
}
/* Echtzeit: solange der Kundenkalender offen ist, jede Minute frisch von Google holen */
setInterval(() => {
  if (chapter === 'kalender' && document.visibilityState !== 'hidden' && !$('#hostApp').classList.contains('hidden')) {
    loadGcalMonth(calKey(), true);
  }
}, 60000);

function renderCalendar(box, d) {
  const key = calKey();
  loadGcalMonth(key);
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const startCol = (new Date(y, m, 1, 12).getDay() + 6) % 7; // Montag = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayISO();
  const gEvents = (gcalCache[key] && gcalCache[key].events) || null;
  const live = !!gEvents;
  /* Termine pro Tag: live aus Google (inkl. SumUp-Kasse) — sonst Fallback auf die Datenbank */
  const gDay = {}, closed = {};
  const addDays = (startIso, endIso, fn) => {
    let dd = new Date(startIso + 'T12:00:00');
    const end = new Date((endIso || startIso) + 'T12:00:00');
    if (isNaN(dd) || isNaN(end)) return;
    for (let i = 0; dd < end && i < 92; i++, dd = new Date(dd.getTime() + 864e5)) fn(dd.toISOString().slice(0, 10));
  };
  if (live) {
    gEvents.forEach(ev => {
      const s = String(ev.start).slice(0, 10);
      if (CLOSED_RX.test(ev.title || '')) {
        if (ev.allDay) addDays(s, String(ev.end).slice(0, 10), iso => { closed[iso] = ev.title; });
        else closed[s] = ev.title;
        return;
      }
      if (ev.allDay) addDays(s, String(ev.end).slice(0, 10), iso => { (gDay[iso] = gDay[iso] || []).push(ev); });
      else (gDay[s] = gDay[s] || []).push(ev);
    });
  } else {
    d.buchungen.forEach(b => {
      if (!b.date || !['bestätigt', 'gewonnen'].includes(b.status)) return;
      (gDay[b.date] = gDay[b.date] || []).push({ title: typeLbl(b.type) + ': ' + b.name, start: b.date + 'T' + String(b.time || ''), allDay: !b.time });
    });
    closures.forEach(c => {
      if (!CLOSED_RX.test(c.title || '')) return;
      addDays(c.start, c.end, iso => { closed[iso] = c.title; });
    });
  }
  /* Offene Website-Anfragen (noch NICHT im Google-Kalender — erst nach dem Annehmen) */
  const pend = {};
  d.buchungen.forEach(b => {
    if (b.date && b.status === 'neu' && !['warteliste', 'geschenk'].includes(b.type)) pend[b.date] = (pend[b.date] || 0) + 1;
  });
  const mn = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  let cells = '';
  for (let i = 0; i < startCol; i++) cells += '<span class="hcal-day empty" aria-hidden="true"></span>';
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const n = (gDay[iso] || []).length;
    const cls = ['hcal-day', iso === today ? 'today' : '', closed[iso] ? 'closed' : '', iso === calSel ? 'sel' : ''].filter(Boolean).join(' ');
    cells += `<button type="button" class="${cls}" data-iso="${iso}" ${closed[iso] ? `title="${esc(closed[iso])}"` : ''}>
      <span class="hcal-n">${day}</span>
      ${n ? `<span class="hcal-count">${n}</span>` : ''}${pend[iso] ? '<span class="hcal-pend" title="offene Anfrage"></span>' : ''}
      ${closed[iso] ? '<span style="font-size:.62rem;display:block;margin-top:1.1rem">geschl.</span>' : ''}
    </button>`;
  }
  /* Tages-Details: Google-Termine + offene Anfragen von der Website */
  const fmtTime = ev => ev.allDay ? 'ganztägig' : String(ev.start).slice(11, 16) + (ev.end && !ev.allDay ? '–' + String(ev.end).slice(11, 16) : '');
  const selEvents = calSel ? (gDay[calSel] || []).slice().sort((a, b2) => String(a.start).localeCompare(String(b2.start))) : [];
  const selPending = calSel ? d.buchungen
    .filter(b => b.date === calSel && b.status === 'neu' && !['warteliste', 'geschenk'].includes(b.type)) : [];
  const stateNote = live
    ? '🟢 <b>Live aus dem Google-Kalender</b> — synchron mit der SumUp-Kasse, aktualisiert sich jede Minute.'
    : (hostCreds ? '⏳ Google-Kalender wird geladen …' : '○ Ohne Cloud-Login: lokale Daten. Zum Live-Kalender bitte neu anmelden.');
  box.innerHTML = `
    <h3 class="host-sect">Kundenkalender</h3>
    <div class="host-note">${stateNote}<br>Grüne Zahl = Termine, rosa Punkt = offene Website-Anfrage (landet erst nach dem <b>Annehmen</b> im Google-Kalender). Ferien &amp; Schliesstage pflegst du in <a href="https://calendar.google.com" target="_blank" rel="noopener">Google</a>/SumUp — sie erscheinen grau und werden auf der Website automatisch geblockt.</div>
    <div class="hcal-head">
      <button type="button" class="hcal-nav" id="hcalPrev" aria-label="Voriger Monat">‹</button>
      <b>${mn[m]} ${y}</b>
      <button type="button" class="hcal-nav" id="hcalNext" aria-label="Nächster Monat">›</button>
    </div>
    <div class="hcal">
      ${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<span class="hcal-wd">${w}</span>`).join('')}
      ${cells}
    </div>
    <div class="hcard" style="margin-top:1rem">
      <div class="hcard-top"><b>➕ Termin eintragen</b><span class="hcard-meta">landet direkt im Google-Kalender &amp; in der SumUp-Kasse</span></div>
      <div class="two-col" style="margin-top:.6rem">
        <div class="field"><label for="hevTitle">Titel</label><input type="text" id="hevTitle" placeholder="z. B. Privatanlass Familie Muster"></div>
        <div class="field"><label for="hevDate">Datum</label><input type="date" id="hevDate" value="${calSel || todayISO()}"></div>
      </div>
      <div class="two-col">
        <div class="field"><label for="hevVon">Von</label><input type="time" id="hevVon"></div>
        <div class="field"><label for="hevBis">Bis</label><input type="time" id="hevBis"></div>
      </div>
      <div class="two-col">
        <div class="field"><label for="hevPers">Personen (optional)</label><input type="number" id="hevPers" min="1" max="99"></div>
        <div class="field"><label for="hevNote">Notiz (optional)</label><input type="text" id="hevNote"></div>
      </div>
      <button type="button" class="btn btn-rose btn-sm" id="hevAdd">Termin eintragen</button>
      <span class="hint" id="hevHint" style="margin-left:.6rem" aria-live="polite">${cloudData ? '' : 'Braucht die Cloud-Verbindung (frisch anmelden).'}</span>
    </div>
    <div id="hcalDetail" style="margin-top:1rem">
      ${calSel ? `<p class="hday">${fmtDay(calSel)}</p>`
        + (selEvents.length ? selEvents.map(ev => `
          <div class="hcard"><div class="hcard-top"><b>${esc(ev.title)}</b><span class="host-pill ${ev.love ? 'ok' : ''}">${fmtTime(ev)}</span></div></div>`).join('') : '')
        + (selPending.length ? `<p class="hday" style="margin-top:.8rem">Offene Anfragen</p><div class="hcards">${selPending.map(b => bookingCard(b, !!cloudData)).join('')}</div>` : '')
        + (!selEvents.length && !selPending.length ? `<p class="host-empty">Keine Termine an diesem Tag.</p>` : '')
        : `<p class="hint">Tipp: Tag antippen für die Termin-Details.</p>`}
    </div>`;
  $('#hcalPrev').addEventListener('click', () => { calMonth = new Date(y, m - 1, 1, 12); render(); });
  $('#hcalNext').addEventListener('click', () => { calMonth = new Date(y, m + 1, 1, 12); render(); });
  /* Individuellen Termin direkt in den Google-Kalender eintragen */
  $('#hevAdd').addEventListener('click', () => {
    const title = $('#hevTitle').value.trim();
    const date = $('#hevDate').value;
    if (!title || !date) { $('#hevHint').textContent = 'Bitte mindestens Titel und Datum angeben.'; return; }
    $('#hevAdd').disabled = true;
    $('#hevHint').textContent = 'Wird eingetragen …';
    hostCall('host_event_add', {
      title, date, von: $('#hevVon').value, bis: $('#hevBis').value,
      persons: $('#hevPers').value, note: $('#hevNote').value.trim()
    });
  });
  box.querySelectorAll('.hcal-day[data-iso]').forEach(btn => btn.addEventListener('click', () => {
    calSel = calSel === btn.dataset.iso ? null : btn.dataset.iso;
    render();
  }));
  wireBookingActions(box);
}

/* ---------- Export ---------- */
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
$('#expKunden').addEventListener('click', () => {
  download('love-kunden.csv', '﻿' + LoveData.toCSV(LoveAccount.listCustomers()), 'text/csv;charset=utf-8');
});
$('#expBackup').addEventListener('click', () => {
  const dump = JSON.parse(LoveData.exportJSON());
  dump.customers = LoveAccount.listCustomers();
  download('love-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(dump, null, 2), 'application/json');
});

show(hasSession());
loadClosures();
})();
</script>
</body>
</html>
